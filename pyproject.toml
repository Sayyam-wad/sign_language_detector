[project]
name = "asl-recognizer"
version = "2.0.0"
description = "Real-time American Sign Language recognition from MediaPipe hand landmarks"
requires-python = ">=3.9,<3.13"
readme = "README.md"
dependencies = [
    "mediapipe>=0.10.9,<0.10.30",
    "opencv-python>=4.8",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
speech = ["pyttsx3>=2.90"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
asl-app = "asl.app:main"
asl-collect = "asl.collect:main"
asl-dataset = "asl.dataset:main"
asl-train = "asl.train:main"
asl-benchmark = "asl.benchmark:main"
asl-atlas = "asl.atlas:main"
asl-doctor = "asl.doctor:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asl"]

[tool.setuptools.package-data]
asl = ["assets/*.json", "assets/*.txt", "assets/*.md"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905", "UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
