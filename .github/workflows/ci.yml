name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt opencv-python-headless
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Environment check (MediaPipe API importable)
        run: python -c "from asl.landmarks import HandDetector; HandDetector(static_image_mode=True).close(); print('mediapipe hands OK')"
